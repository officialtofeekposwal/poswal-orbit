<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="ogbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="1" stop-color="#0F1626"/>
    </linearGradient>
    <radialGradient id="ogmesh" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.25"/>
      <stop offset="0.4" stop-color="#8B7CFF" stop-opacity="0.18"/>
      <stop offset="0.8" stop-color="#FF7A59" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="0.5" stop-color="#8B7CFF"/>
      <stop offset="1" stop-color="#FF7A59"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogbg)"/>
  <rect width="1200" height="630" fill="url(#ogmesh)"/>

  <!-- Brand Glyph & Rings -->
  <g transform="translate(600, 210)">
    <ellipse cx="0" cy="0" rx="340" ry="105" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="340" ry="105" fill="none" stroke="url(#grad)" stroke-width="3" stroke-dasharray="140 380"/>
    <circle cx="260" cy="-60" r="18" fill="#FFC857"/>
    <circle cx="0" cy="0" r="48" fill="#14B8A6" fill-opacity="0.15" stroke="#14B8A6" stroke-width="4"/>
  </g>

  <!-- Typography -->
  <text x="600" y="370" font-size="64" font-weight="800" letter-spacing="-1.5" text-anchor="middle" fill="#FFFFFF">Poswal Orbit</text>
  <text x="600" y="420" font-size="24" font-weight="500" text-anchor="middle" fill="#CBD5E1">Your whole day, in orbit.</text>
  <text x="600" y="465" font-size="16" text-anchor="middle" fill="#94A3B8">Offline-first personal workspace for habits, tasks and notes on Android.</text>

  <!-- Spec Pills -->
  <g transform="translate(600, 525)">
    <rect x="-260" y="-18" width="160" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <text x="-180" y="5" font-size="12" font-family="monospace" font-weight="700" text-anchor="middle" fill="#14B8A6">100% OFFLINE</text>

    <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <text x="0" y="5" font-size="12" font-family="monospace" font-weight="700" text-anchor="middle" fill="#8B7CFF">ZERO TRACKERS</text>

    <rect x="100" y="-18" width="160" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <text x="180" y="5" font-size="12" font-family="monospace" font-weight="700" text-anchor="middle" fill="#FFC857">EN · HI · UR RTL</text>
  </g>
</svg>
