<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="360" height="760">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F1626"/>
    </linearGradient>
  </defs>
  <rect width="360" height="760" fill="url(#bg)"/>

  <!-- Status Bar -->
  <text x="24" y="38" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">9:41</text>
  <circle cx="330" cy="34" r="5" fill="#14B8A6"/>

  <!-- Top App Bar -->
  <text x="24" y="80" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" letter-spacing="1">MARKDOWN EDITOR</text>
  <text x="24" y="112" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="24" font-weight="700">Sprint Retrospective</text>

  <!-- Formatting Toolbar -->
  <g transform="translate(20, 136)">
    <rect width="320" height="42" rx="12" fill="#0F1626" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="20" y="26" fill="#14B8A6" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">H1</text>
    <text x="56" y="26" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">H2</text>
    <text x="92" y="26" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">B</text>
    <text x="124" y="26" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13" font-style="italic">I</text>
    <text x="154" y="26" fill="#14B8A6" font-family="-apple-system, sans-serif" font-size="13">[ ]</text>
    <text x="190" y="26" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13">#tag</text>
    <text x="280" y="26" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">AUTO-SAVED</text>
  </g>

  <!-- Note Body with Dimmed Markdown Tokens -->
  <g transform="translate(20, 196)">
    <rect width="320" height="460" rx="16" fill="#0F1626" stroke="#FFFFFF" stroke-opacity="0.08"/>
    
    <g transform="translate(18, 28)">
      <!-- Title line -->
      <text x="0" y="0" fill="#64748B" font-family="ui-monospace, monospace" font-size="14"># </text>
      <text x="18" y="0" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Sprint Retrospective</text>

      <!-- Paragraph line -->
      <text x="0" y="32" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="13" line-height="1.5">Offline SQLite v3 migrations tested with zero data loss.</text>

      <!-- Subtitle line -->
      <text x="0" y="68" fill="#64748B" font-family="ui-monospace, monospace" font-size="13">## </text>
      <text x="24" y="68" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Action Items</text>

      <!-- Checklist items with direct checkboxes -->
      <g transform="translate(0, 92)">
        <rect x="0" y="0" width="16" height="16" rx="4" fill="#14B8A6"/>
        <path d="M4 8 L7 11 L12 5" fill="none" stroke="#070B14" stroke-width="2" stroke-linecap="round"/>
        <text x="26" y="13" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13" text-decoration="line-through">Verify R8 tree-shaking rules</text>
      </g>

      <g transform="translate(0, 124)">
        <rect x="0" y="0" width="16" height="16" rx="4" fill="#14B8A6"/>
        <path d="M4 8 L7 11 L12 5" fill="none" stroke="#070B14" stroke-width="2" stroke-linecap="round"/>
        <text x="26" y="13" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13" text-decoration="line-through">Confirm zero internet permission</text>
      </g>

      <g transform="translate(0, 156)">
        <rect x="0" y="0" width="16" height="16" rx="4" fill="#162035" stroke="#94A3B8" stroke-width="1.5"/>
        <text x="26" y="13" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13">Review hardware screenshots on phone</text>
      </g>

      <!-- Blockquote / Note -->
      <g transform="translate(0, 200)">
        <rect x="0" y="0" width="3" height="48" fill="#8B7CFF"/>
        <text x="12" y="18" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">Everything is stored locally on device.</text>
        <text x="12" y="38" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">Automatic 7-day snapshot rotation active.</text>
      </g>
    </g>
  </g>

  <!-- Bottom Nav -->
  <g transform="translate(0, 680)">
    <rect width="360" height="80" fill="#0F1626" fill-opacity="0.85"/>
    <line x1="0" y1="0" x2="360" y2="0" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="90" cy="35" r="4" fill="#94A3B8"/>
    <text x="90" y="52" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">TODAY</text>
    <circle cx="180" cy="35" r="4" fill="#94A3B8"/>
    <text x="180" y="52" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">HABITS</text>
    <circle cx="270" cy="35" r="4" fill="#14B8A6"/>
    <text x="270" y="52" fill="#14B8A6" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">NOTES</text>
  </g>
</svg>
