<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="360" height="760">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F1626"/>
    </linearGradient>
  </defs>
  <rect width="360" height="760" fill="url(#bg)"/>

  <!-- Status Bar -->
  <text x="24" y="38" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">9:41</text>
  <circle cx="330" cy="34" r="5" fill="#14B8A6"/>

  <!-- Top App Bar -->
  <text x="24" y="80" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" letter-spacing="1">TASKS</text>
  <text x="24" y="112" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="24" font-weight="700">Quick Add</text>

  <!-- Natural Language Quick-Add Input Box -->
  <g transform="translate(20, 136)">
    <rect width="320" height="74" rx="16" fill="#0F1626" stroke="#14B8A6" stroke-width="1.5"/>
    <text x="16" y="32" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14">Pay rent tomorrow 4pm</text>
    <rect x="16" y="44" width="56" height="18" rx="6" fill="#FF7A59" fill-opacity="0.2"/>
    <text x="44" y="57" fill="#FF7A59" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">HIGH</text>
    <rect x="80" y="44" width="60" height="18" rx="6" fill="#8B7CFF" fill-opacity="0.2"/>
    <text x="110" y="57" fill="#8B7CFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">#HOME</text>
    <circle cx="295" cy="37" r="14" fill="#14B8A6"/>
    <path d="M290 37 L294 41 L301 33" fill="none" stroke="#070B14" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Task Items Group -->
  <g transform="translate(20, 230)">
    <text x="4" y="16" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" letter-spacing="0.5">DUE TODAY (2)</text>

    <!-- Task 1 -->
    <g transform="translate(0, 30)">
      <rect width="320" height="88" rx="16" fill="#0F1626" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <circle cx="28" cy="32" r="10" fill="none" stroke="#FF7A59" stroke-width="2"/>
      <text x="48" y="30" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Review security advisory</text>
      <text x="48" y="50" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">Today at 2:30 PM · High priority</text>
      <rect x="48" y="58" width="54" height="18" rx="6" fill="#FF7A59" fill-opacity="0.15"/>
      <text x="75" y="71" fill="#FF7A59" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">HIGH</text>
      <rect x="108" y="58" width="60" height="18" rx="6" fill="#162035"/>
      <text x="138" y="71" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">#SECURITY</text>
    </g>

    <!-- Task 2 (Subtasks) -->
    <g transform="translate(0, 130)">
      <rect width="320" height="136" rx="16" fill="#0F1626" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <circle cx="28" cy="32" r="10" fill="none" stroke="#14B8A6" stroke-width="2"/>
      <text x="48" y="30" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Verify offline export</text>
      <text x="48" y="50" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">Today at 6:00 PM · 2 of 3 subtasks</text>
      
      <!-- Subtask items -->
      <g transform="translate(48, 64)">
        <text x="0" y="14" fill="#14B8A6" font-family="-apple-system, sans-serif" font-size="12">✓ JSON schema validated</text>
        <text x="0" y="34" fill="#14B8A6" font-family="-apple-system, sans-serif" font-size="12">✓ Loop CSV parsed</text>
        <text x="0" y="54" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">○ Verify file integrity checksum</text>
      </g>
    </g>
  </g>

  <!-- Bottom Nav -->
  <g transform="translate(0, 680)">
    <rect width="360" height="80" fill="#0F1626" fill-opacity="0.85"/>
    <line x1="0" y1="0" x2="360" y2="0" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="90" cy="35" r="4" fill="#14B8A6"/>
    <text x="90" y="52" fill="#14B8A6" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">TODAY</text>
    <circle cx="180" cy="35" r="4" fill="#94A3B8"/>
    <text x="180" y="52" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">HABITS</text>
    <circle cx="270" cy="35" r="4" fill="#94A3B8"/>
    <text x="270" y="52" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">NOTES</text>
  </g>
</svg>
