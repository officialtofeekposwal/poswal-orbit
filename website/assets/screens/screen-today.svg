<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="360" height="760">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0F1626"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8B7CFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF7A59" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="360" height="760" fill="url(#bg)"/>
  
  <!-- Status bar -->
  <text x="24" y="38" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">9:41</text>
  <circle cx="330" cy="34" r="5" fill="#14B8A6"/>

  <!-- App Header -->
  <text x="24" y="80" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" letter-spacing="1">TODAY</text>
  <text x="24" y="112" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="26" font-weight="700">Orbit Loop</text>

  <!-- Concentric Orbit Ring Graphic -->
  <g transform="translate(180, 230)">
    <circle cx="0" cy="0" r="85" fill="none" stroke="#162035" stroke-width="12"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="url(#aurora)" stroke-width="12" stroke-dasharray="534" stroke-dashoffset="160" stroke-linecap="round" transform="rotate(-90)"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#162035" stroke-width="10"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#14B8A6" stroke-width="10" stroke-dasharray="390" stroke-dashoffset="120" stroke-linecap="round" transform="rotate(-90)"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#162035" stroke-width="8"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#FF7A59" stroke-width="8" stroke-dasharray="264" stroke-dashoffset="60" stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="8" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" text-anchor="middle">70%</text>
    <text x="0" y="26" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">COMPLETE</text>
  </g>

  <!-- Habit items -->
  <g transform="translate(20, 360)">
    <rect width="320" height="64" rx="16" fill="#0F1626" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="36" cy="32" r="14" fill="#14B8A6" fill-opacity="0.2" stroke="#14B8A6" stroke-width="2"/>
    <path d="M30 32 L34 36 L42 27" fill="none" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Morning walk</text>
    <text x="64" y="46" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">14 day streak · 92% consistency</text>
    <rect x="256" y="22" width="48" height="20" rx="10" fill="#14B8A6" fill-opacity="0.15"/>
    <text x="280" y="36" fill="#14B8A6" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">DONE</text>
  </g>

  <g transform="translate(20, 436)">
    <rect width="320" height="64" rx="16" fill="#0F1626" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="36" cy="32" r="14" fill="#14B8A6" fill-opacity="0.2" stroke="#14B8A6" stroke-width="2"/>
    <path d="M30 32 L34 36 L42 27" fill="none" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Drink 2L water</text>
    <text x="64" y="46" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">21 day streak · Freeze safe</text>
    <rect x="256" y="22" width="48" height="20" rx="10" fill="#14B8A6" fill-opacity="0.15"/>
    <text x="280" y="36" fill="#14B8A6" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">DONE</text>
  </g>

  <g transform="translate(20, 512)">
    <rect width="320" height="64" rx="16" fill="#0F1626" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="36" cy="32" r="14" fill="#162035" stroke="#94A3B8" stroke-width="2"/>
    <text x="64" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Read 20 minutes</text>
    <text x="64" y="46" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">Evening check-in · 4:00 AM rule</text>
    <rect x="256" y="22" width="48" height="20" rx="10" fill="#162035"/>
    <text x="280" y="36" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">PENDING</text>
  </g>

  <!-- Bottom Nav -->
  <g transform="translate(0, 680)">
    <rect width="360" height="80" fill="#0F1626" fill-opacity="0.85"/>
    <line x1="0" y1="0" x2="360" y2="0" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="90" cy="35" r="4" fill="#14B8A6"/>
    <text x="90" y="52" fill="#14B8A6" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">TODAY</text>
    <circle cx="180" cy="35" r="4" fill="#94A3B8"/>
    <text x="180" y="52" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">HABITS</text>
    <circle cx="270" cy="35" r="4" fill="#94A3B8"/>
    <text x="270" y="52" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">NOTES</text>
  </g>
