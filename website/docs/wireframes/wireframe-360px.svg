<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 2100" width="360" height="2100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="1" stop-color="#0A1020"/>
    </linearGradient>
  </defs>

  <rect width="360" height="2100" fill="url(#mbg)"/>

  <!-- Mobile Top Bar -->
  <rect x="0" y="0" width="360" height="56" fill="#0F1626" fill-opacity="0.9"/>
  <line x1="0" y1="56" x2="360" y2="56" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="20" y="35" font-size="15" font-weight="700" fill="#FFFFFF">POSWAL ORBIT</text>
  <rect x="250" y="14" width="90" height="28" rx="14" fill="#14B8A6"/>
  <text x="295" y="33" font-size="11" font-weight="700" text-anchor="middle" fill="#070B14">GET APP</text>

  <!-- Mobile Hero -->
  <rect x="20" y="85" width="220" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.05" stroke="#14B8A6" stroke-opacity="0.4"/>
  <text x="130" y="102" font-size="10" font-family="monospace" font-weight="700" text-anchor="middle" fill="#14B8A6">PRE-RELEASE · v0.9.0-BETA.1</text>
  <text x="20" y="150" font-size="32" font-weight="800" fill="#FFFFFF">Your whole day,</text>
  <text x="20" y="190" font-size="32" font-weight="800" fill="#14B8A6">in orbit.</text>
  <text x="20" y="225" font-size="14" fill="#94A3B8">Habits, tasks and notes in one calm app. Everything stays on your phone.</text>

  <!-- Mobile Buttons -->
  <rect x="20" y="260" width="320" height="46" rx="23" fill="#14B8A6"/>
  <text x="180" y="289" font-size="15" font-weight="700" text-anchor="middle" fill="#070B14">Get the app</text>
  <rect x="20" y="318" width="320" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.2"/>
  <text x="180" y="347" font-size="14" font-weight="600" text-anchor="middle" fill="#FFFFFF">View on GitHub</text>

  <!-- Mobile Phone Card -->
  <g transform="translate(180, 530)">
    <rect x="-110" y="-140" width="220" height="290" rx="28" fill="#0F1626" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2"/>
    <circle cx="0" cy="-40" r="40" fill="none" stroke="#14B8A6" stroke-width="8"/>
    <text x="0" y="-35" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">68%</text>
    <rect x="-80" y="15" width="160" height="30" rx="8" fill="#162035"/>
    <rect x="-80" y="55" width="160" height="30" rx="8" fill="#162035"/>
    <rect x="-80" y="95" width="160" height="30" rx="8" fill="#162035"/>
  </g>
  <text x="180" y="700" font-size="10" fill="#94A3B8" text-anchor="middle">Illustration. Real screenshots arrive after device test.</text>

  <!-- Mobile Simulator -->
  <text x="20" y="760" font-size="11" font-family="monospace" font-weight="700" fill="#14B8A6">01 // LIVE SIMULATOR</text>
  <text x="20" y="795" font-size="24" font-weight="800" fill="#FFFFFF">Try the orbit loop</text>
  <rect x="20" y="815" width="320" height="380" rx="18" fill="#0F1626" stroke="#FFFFFF" stroke-opacity="0.1"/>

  <text x="40" y="850" font-size="15" font-weight="700" fill="#FFFFFF">Habits Check-in</text>
  <rect x="40" y="870" width="280" height="50" rx="12" fill="#162035"/>
  <circle cx="65" cy="895" r="10" fill="#14B8A6"/>
  <text x="90" y="900" font-size="13" font-weight="600" fill="#FFFFFF">Morning walk</text>

  <rect x="40" y="930" width="280" height="50" rx="12" fill="#162035"/>
  <circle cx="65" cy="955" r="10" fill="#14B8A6"/>
  <text x="90" y="960" font-size="13" font-weight="600" fill="#FFFFFF">Drink 2L water</text>

  <text x="40" y="1025" font-size="15" font-weight="700" fill="#FFFFFF">Quick Task Parser</text>
  <rect x="40" y="1045" width="280" height="40" rx="10" fill="#070B14" stroke="#14B8A6" stroke-opacity="0.5"/>
  <text x="50" y="1070" font-size="11" font-family="monospace" fill="#FFFFFF">Pay rent tomorrow 4pm !high</text>
  <rect x="40" y="1100" width="110" height="26" rx="13" fill="#162035" stroke="#14B8A6" stroke-opacity="0.4"/>
  <text x="95" y="1118" font-size="10" text-anchor="middle" fill="#14B8A6">Tomorrow 4pm</text>
  <rect x="160" y="1100" width="90" height="26" rx="13" fill="#162035" stroke="#FF7A59" stroke-opacity="0.4"/>
  <text x="205" y="1118" font-size="10" text-anchor="middle" fill="#FF7A59">! High</text>

  <!-- Mobile Feature Stack -->
  <text x="20" y="1250" font-size="11" font-family="monospace" font-weight="700" fill="#8B7CFF">02 // CORE SYSTEMS</text>
  <text x="20" y="1285" font-size="24" font-weight="800" fill="#FFFFFF">Calm and permanent</text>

  <rect x="20" y="1315" width="320" height="100" rx="16" fill="#0F1626" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="40" y="1345" font-size="10" font-family="monospace" fill="#14B8A6">01 // TODAY</text>
  <text x="40" y="1370" font-size="16" font-weight="700" fill="#FFFFFF">Unified Orbit Ring</text>
  <text x="40" y="1395" font-size="12" fill="#94A3B8">Habits & tasks in one timeline.</text>

  <rect x="20" y="1430" width="320" height="100" rx="16" fill="#0F1626" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="40" y="1460" font-size="10" font-family="monospace" fill="#8B7CFF">02 // HABITS</text>
  <text x="40" y="1485" font-size="16" font-weight="700" fill="#FFFFFF">EWMA Consistency</text>
  <text x="40" y="1510" font-size="12" fill="#94A3B8">Streak freeze & 14-week heatmap.</text>

  <rect x="20" y="1545" width="320" height="100" rx="16" fill="#0F1626" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="40" y="1575" font-size="10" font-family="monospace" fill="#FF7A59">03 // TASKS</text>
  <text x="40" y="1600" font-size="16" font-weight="700" fill="#FFFFFF">Natural Quick Add</text>
  <text x="40" y="1625" font-size="12" fill="#94A3B8">Instant date, priority & subtasks.</text>

  <rect x="20" y="1660" width="320" height="100" rx="16" fill="#0F1626" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="40" y="1690" font-size="10" font-family="monospace" fill="#FFC857">04 // PRIVACY</text>
  <text x="40" y="1715" font-size="16" font-weight="700" fill="#FFFFFF">0 Network Permission</text>
  <text x="40" y="1740" font-size="12" fill="#94A3B8">Release builds omit INTERNET.</text>

  <!-- Mobile Download CTA Card -->
  <rect x="20" y="1790" width="320" height="180" rx="20" fill="#0F1626" stroke="#14B8A6" stroke-opacity="0.4"/>
  <text x="40" y="1825" font-size="11" font-family="monospace" fill="#14B8A6">06 // GET IT</text>
  <text x="40" y="1855" font-size="18" font-weight="800" fill="#FFFFFF">Download Release APK</text>
  <text x="40" y="1880" font-size="12" fill="#94A3B8">v0.9.0-beta.1 · 74.8 MB · 228 CI tests</text>
  <rect x="40" y="1905" width="280" height="44" rx="22" fill="#14B8A6"/>
  <text x="180" y="1932" font-size="14" font-weight="700" text-anchor="middle" fill="#070B14">Download APK</text>
</svg>
