name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Set permissions for GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch repository release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p website/data
          node -e '
            const fs = require("node:fs");
            const https = require("node:https");

            const repo = process.env.REPO;
            const token = process.env.GH_TOKEN;
            const options = {
              hostname: "api.github.com",
              path: `/repos/${repo}/releases`,
              headers: {
                "User-Agent": "GitHubActions-PoswalOrbit",
                "Authorization": `Bearer ${token}`,
                "Accept": "application/vnd.github.v3+json"
              }
            };

            https.get(options, (res) => {
              let data = "";
              res.on("data", chunk => data += chunk);
              res.on("end", () => {
                try {
                  const releases = JSON.parse(data);
                  const valid = Array.isArray(releases) ? releases.find(r => !r.draft) : null;
                  if (!valid) {
                    console.log("No non-draft release found. Writing fallback state.");
                    fs.writeFileSync("website/data/release.json", JSON.stringify({ hasRelease: false }, null, 2));
                    return;
                  }

                  const apkAsset = (valid.assets || []).find(a => a.name.endsWith(".apk") && !a.name.includes("debug")) || valid.assets[0];
                  const shaAsset = (valid.assets || []).find(a => a.name.endsWith(".sha256") || a.name.endsWith(".txt"));

                  const releaseInfo = {
                    hasRelease: true,
                    tagName: valid.tag_name,
                    isPrerelease: Boolean(valid.prerelease),
                    publishedAt: valid.published_at,
                    apkName: apkAsset ? apkAsset.name : "",
                    apkUrl: apkAsset ? apkAsset.browser_download_url : valid.html_url,
                    apkSize: apkAsset ? `${(apkAsset.size / (1024 * 1024)).toFixed(1)} MB` : "",
                    apkSha256: apkAsset && apkAsset.digest ? apkAsset.digest.replace("sha256:", "") : "",
                    sha256Url: shaAsset ? shaAsset.browser_download_url : ""
                  };

                  fs.writeFileSync("website/data/release.json", JSON.stringify(releaseInfo, null, 2));
                  console.log("Written website/data/release.json successfully:", releaseInfo.tagName);
                } catch (e) {
                  console.warn("Could not process release API response. Writing fallback.", e);
                  fs.writeFileSync("website/data/release.json", JSON.stringify({ hasRelease: false }, null, 2));
                }
              });
            }).on("error", (err) => {
              console.warn("Network error fetching releases:", err);
              fs.writeFileSync("website/data/release.json", JSON.stringify({ hasRelease: false }, null, 2));
            });
          '

      - name: Build static website
        run: node website/build.mjs
        env:
          BASE_PATH: /poswal-orbit/

      - name: Run website test suite
        run: node --test website/tests/site.test.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
