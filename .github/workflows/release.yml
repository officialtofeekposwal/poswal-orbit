name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build_release:
    name: Build Signed Release APK & AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run verification tests
        run: flutter test --no-test-assets

      - name: Decode Android Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
            storePassword=$KEYSTORE_PASSWORD
            keyPassword=$KEY_PASSWORD
            keyAlias=$KEY_ALIAS
            storeFile=upload-keystore.jks
            EOF
            echo "Release keystore configured successfully."
          else
            echo "No release keystore secret provided. Building with fallback signing."
          fi

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Release App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Rename Release Artifacts
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v1.0.0"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk poswal-orbit-$TAG.apk
          cp build/app/outputs/bundle/release/app-release.aab poswal-orbit-$TAG.aab

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poswal-orbit-release-binaries
          path: |
            poswal-orbit-*.apk
            poswal-orbit-*.aab
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag_name != ''
        with:
          name: Poswal Orbit ${{ github.ref_name || github.event.inputs.tag_name }}
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          files: |
            poswal-orbit-*.apk
            poswal-orbit-*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
