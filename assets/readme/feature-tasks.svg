<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="100%" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Task quick-add illustration</title><desc id="d">A sentence being typed into a quick-add field, then split into date, priority and tag chips. Decorative illustration.</desc>
<defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F1626"/><stop offset="1" stop-color="#0A1020"/></linearGradient><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14B8A6"/><stop offset=".55" stop-color="#8B7CFF"/><stop offset="1" stop-color="#FF7A59"/></linearGradient><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter><clipPath id="fc"><rect x="56" y="70" width="500" height="48"/></clipPath></defs>
<style>.st{display:none}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.8}}.tw{opacity:.5;animation:tw 7s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none !important}.mv{display:none}.st{display:inline}}@keyframes grp{0%{opacity:0}4%,88%{opacity:1}97%,100%{opacity:0}}.grp{animation:grp 12s ease-in-out infinite both}@keyframes typ{0%,6%{transform:translateX(0)}38%,100%{transform:translateX(440px)}}.cov{animation:typ 12s steps(33,end) infinite both}@keyframes c1{0%,40%{opacity:0;transform:translateY(8px)}46%,100%{opacity:1;transform:none}}@keyframes c2{0%,47%{opacity:0;transform:translateY(8px)}53%,100%{opacity:1;transform:none}}@keyframes c3{0%,54%{opacity:0;transform:translateY(8px)}60%,100%{opacity:1;transform:none}}.c1{animation:c1 12s ease-out infinite both}.c2{animation:c2 12s ease-out infinite both}.c3{animation:c3 12s ease-out infinite both}</style>
<rect x="1" y="1" width="598" height="258" rx="26" fill="url(#pg)" stroke="#FFFFFF" stroke-opacity=".12"/><text x="34" y="46" font-size="20" font-weight="600" fill="#A9B4CB">Quick add</text><g class="grp"><rect x="30" y="62" width="540" height="64" rx="32" fill="#1A2438" stroke="#FFFFFF" stroke-opacity=".16"/><text x="60" y="102" font-size="24" fill="#F4F6FB" xml:space="preserve">Pay rent tomorrow 4pm !high #home</text><g clip-path="url(#fc)"><rect class="cov" x="56" y="70" width="470" height="48" fill="#1A2438" transform="translate(440 0)"/></g><g class="c1"><rect x="30" y="156" width="190" height="46" rx="23" fill="#14B8A6" fill-opacity=".22" stroke="#14B8A6" stroke-opacity=".8"/><text x="125.0" y="187" text-anchor="middle" font-size="22" font-weight="600" fill="#F4F6FB">tomorrow, 4 pm</text></g><g class="c2"><rect x="232" y="156" width="96" height="46" rx="23" fill="#FF7A59" fill-opacity=".22" stroke="#FF7A59" stroke-opacity=".8"/><text x="280.0" y="187" text-anchor="middle" font-size="22" font-weight="600" fill="#F4F6FB">High</text></g><g class="c3"><rect x="340" y="156" width="110" height="46" rx="23" fill="#8B7CFF" fill-opacity=".22" stroke="#8B7CFF" stroke-opacity=".8"/><text x="395.0" y="187" text-anchor="middle" font-size="22" font-weight="600" fill="#F4F6FB">#home</text></g></g>
</svg>
