<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="100%" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Section divider</title><desc id="d">A thin gradient line with a small gold planet travelling along it.</desc>
<defs><linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14B8A6" stop-opacity="0"/><stop offset=".25" stop-color="#14B8A6" stop-opacity=".7"/><stop offset=".5" stop-color="#8B7CFF" stop-opacity=".7"/><stop offset=".75" stop-color="#FF7A59" stop-opacity=".7"/><stop offset="1" stop-color="#FF7A59" stop-opacity="0"/></linearGradient><filter id="soft" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4"/></filter></defs>
<style>.st{display:none}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.8}}.tw{opacity:.5;animation:tw 7s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none !important}.mv{display:none}.st{display:inline}}</style>
<rect x="40" y="19" width="1120" height="2" rx="1" fill="url(#ln)"/><g class="mv"><g><animateMotion dur="30s" repeatCount="indefinite" path="M40,20 H1160 H40" calcMode="linear"/><circle r="9" fill="#FFC857" opacity=".4" filter="url(#soft)"/><circle r="4.5" fill="#FFC857"/></g></g><g class="st"><circle cx="600" cy="20" r="9" fill="#FFC857" opacity=".4"/><circle cx="600" cy="20" r="4.5" fill="#FFC857"/></g>
</svg>
