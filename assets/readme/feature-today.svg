<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="100%" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Today ring illustration</title><desc id="d">A progress ring slowly filling next to three rows being ticked off. Decorative illustration.</desc>
<defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F1626"/><stop offset="1" stop-color="#0A1020"/></linearGradient><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14B8A6"/><stop offset=".55" stop-color="#8B7CFF"/><stop offset="1" stop-color="#FF7A59"/></linearGradient><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter></defs>
<style>.st{display:none}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.8}}.tw{opacity:.5;animation:tw 7s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none !important}.mv{display:none}.st{display:inline}}@keyframes fillring{from{stroke-dashoffset:var(--c)}to{stroke-dashoffset:var(--o)}}.fill{animation:fillring 12s ease-in-out infinite alternate}@keyframes tick{0%,6%{stroke-dashoffset:24}18%,86%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:24}}.tick{animation:tick 12s ease-in-out infinite both}</style>
