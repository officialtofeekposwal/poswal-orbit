<style>.st{display:none}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.8}}.tw{opacity:.5;animation:tw 7s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none !important}.mv{display:none}.st{display:inline}}@keyframes tb{0%,100%{fill-opacity:.07}50%{fill-opacity:.22}}.tb{animation:tb 8s ease-in-out infinite both}@keyframes cur{0%,100%{opacity:1}50%{opacity:.15}}.cur{animation:cur 1.8s ease-in-out infinite}</style>
