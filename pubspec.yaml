name: poswal_orbit
description: "Your whole day, in orbit. A calm, beautiful, offline-first habit tracker + to-do + notes app for iOS and Android, built with Flutter."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  phosphoricons_flutter: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/app-icon/ios-1024-default.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/brand/app-icon/android-adaptive-background.png"
  adaptive_icon_foreground: "assets/brand/app-icon/android-adaptive-foreground.png"
  adaptive_icon_monochrome: "assets/brand/app-icon/android-adaptive-monochrome.png"

flutter_native_splash:
  color: "#F4F6FB"
  image: assets/brand/splash/splash-symbol-transparent-1152.png
  color_dark: "#070B14"
  image_dark: assets/brand/splash/splash-symbol-transparent-1152.png
  android_12:
    color: "#F4F6FB"
    image: assets/brand/splash/splash-symbol-transparent-1152.png
    color_dark: "#070B14"
    image_dark: assets/brand/splash/splash-symbol-transparent-1152.png

flutter:
  uses-material-design: true

  assets:
    - assets/brand/logo/png/
    - assets/brand/app-icon/
    - assets/brand/splash/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
