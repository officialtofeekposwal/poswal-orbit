name: poswal_orbit
description: "Your whole day, in orbit. A calm, beautiful, offline-first habit tracker + to-do + notes app for iOS and Android, built with Flutter."
publish_to: 'none'

version: 0.9.1-beta.2+2

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  phosphoricons_flutter: ^1.1.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  intl: ^0.20.3
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
  share_plus: ^13.3.1
  home_widget: ^0.10.0
  yaml: ^3.1.4
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  sqlite3: ^3.9.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/app-icon/ios-1024-default.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/brand/app-icon/android-adaptive-background.png"
  adaptive_icon_foreground: "assets/brand/app-icon/android-adaptive-foreground.png"
  adaptive_icon_monochrome: "assets/brand/app-icon/android-adaptive-monochrome.png"

flutter_native_splash:
  color: "#F4F6FB"
  image: assets/brand/splash/splash-symbol-transparent-1152.png
  color_dark: "#070B14"
  image_dark: assets/brand/splash/splash-symbol-transparent-1152.png
  android_12:
    color: "#F4F6FB"
    image: assets/brand/splash/splash-symbol-transparent-1152.png
    color_dark: "#070B14"
    image_dark: assets/brand/splash/splash-symbol-transparent-1152.png

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/logo/png/
    - assets/brand/app-icon/
    - assets/brand/splash/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
